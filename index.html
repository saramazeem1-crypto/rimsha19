<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For My Rimsha - 19</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f9c5d1,#fbc2eb,#fad0c4);font-family:'Courier New',monospace;display:flex;justify-content:center;padding:12px;min-height:100vh}.window{width:100%;max-width:420px;background:#fffaf2;border:3px solid #000;box-shadow:8px 8px 0 #000;margin:auto}.header{background:#ff8fba;padding:10px 12px;display:flex;justify-content:space-between;border-bottom:3px solid #000;font-weight:bold;font-size:13px}.hidden{display:none!important}.curtains{position:relative;height:520px;background:linear-gradient(180deg,#c95a7d 0%,#a84a68 100%);overflow:hidden}.curtain{position:absolute;width:50.5%;height:100%;background:linear-gradient(90deg,#9e425f,#a84a68);transition:1.6s;z-index:2;top:0}.left{left:0}.right{right:0}.open .left{transform:translateX(-102%)}.open .right{transform:translateX(102%)}.seal-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff0f5;border:3px solid #000;border-radius:50%;width:135px;height:135px;z-index:5;cursor:pointer;font-weight:bold;box-shadow:4px 4px 0 #000;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:18px}.count{font-size:150px;color:#ff6b9d;text-align:center;margin:80px 0;font-weight:bold;text-shadow:4px 4px 0 #000}.btn{background:#ff8fba;border:3px solid #000;padding:14px 24px;font-weight:bold;box-shadow:4px 4px 0 #000;cursor:pointer;margin:12px;font-family:inherit}.gallery{display:flex;overflow-x:auto;gap:12px;padding:14px;scroll-snap-type:x mandatory}.gallery img{width:270px;height:360px;object-fit:cover;border:3px solid #000;flex-shrink:0;scroll-snap-align:center}.confetti{position:fixed;width:12px;height:12px;top:-12px;animation:fall 3.5s linear;z-index:99;border:1px solid #000}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}</style></head><body>
<div id="seal-screen" class="window"><div class="header"><span>SEAL.EXE</span><span>● ● ●</span></div><div class="curtains" id="curtains"><div class="curtain left"></div><div class="curtain right"></div><button class="seal-btn" id="sealBtn"><span>SEAL</span><small style="font-size:10px;margin-top:4px;text-align:center">HOLD 2 SEC<br>DON'T LET GO!</small></button></div></div>
<div id="countdown" class="window hidden"><div class="header"><span>SEAL.EXE</span></div><div class="count" id="countNum">3</div><p style="text-align:center;font-size:12px;opacity:.6">INITIATING SURPRISE...</p></div>
<div id="party" class="window hidden"><div class="header"><span>PARTY.EXE</span><span>19 YEARS</span></div><div style="text-align:center;padding:28px 20px"><div style="font-size:60px">🎉</div><h2 style="color:#d94a7a">My girl was born<br><span style="background:#ff8fba;padding:2px 8px;border:2px solid #000">19 years ago today!</span></h2><p>Yes, it's YOU!<br><b style="font-size:22px;color:#d94a7a">Rimsha</b></p><button class="btn" onclick="showCake()">START THE SURPRISE →</button></div></div>
<div id="cake-screen" class="window hidden"><div class="header"><span>CAKE.EXE</span></div><div style="text-align:center;padding:28px 20px"><h3>Cut the Cake!</h3><div id="cake" style="font-size:120px;cursor:pointer;margin:20px 0">🎂</div><h2 id="happyText" class="hidden" style="color:#d94a7a">Happy Birthday, My Girl! 💖</h2><button id="nextToGallery" class="btn hidden" onclick="showGallery()">OUR MEMORIES →</button></div></div>
<div id="gallery" class="window hidden"><div class="header"><span>GALLERY.EXE</span><span>4 PICS</span></div><div style="padding:16px"><h3 style="color:#d94a7a;margin:0 0 6px">Our Memories</h3><div class="gallery"><img src="https://i.ibb.co/27b5WDGx/IMG-20241013-WA0028.jpg"><img src="https://i.ibb.co/v4T9v5kK/IMG-20241015-WA0023.jpg"><img src="https://i.ibb.co/5gK0qT5n/IMG-20241019-WA0005.jpg"><img src="https://i.ibb.co/5WTnTmbL/IMG-20241019-WA0004.jpg"></div><div style="text-align:center;margin-top:16px"><button class="btn" onclick="showLetter()">READ MY LETTER →</button></div></div></div>
<div id="letter" class="window hidden"><div class="header"><span>LETTER.EXE</span></div><div style="padding:18px"><h3 style="color:#d94a7a">A Letter For You 💌</h3><div id="sealToOpen" style="width:90px;height:90px;background:#ffc2d6;border:3px solid #000;border-radius:50%;margin:24px auto;display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:4px 4px 0 #000;font-weight:bold"><span>TAP<br>TO OPEN</span></div><div id="messageBox" class="hidden" style="text-align:left;font-size:13.5px;white-space:pre-line;background:#fff;border:2.5px solid #000;padding:16px;line-height:1.6;box-shadow:4px 4px 0 #000"></div><button id="finalBtn" class="btn hidden" onclick="finalConfetti()" style="width:100%;margin-top:18px">I Love You Too ❤️</button></div></div>
<script>
let holdTimer;const sealBtn=document.getElementById('sealBtn');const curtains=document.getElementById('curtains');function startHold(e){e.preventDefault();sealBtn.innerHTML='<span>OPENING...</span>';holdTimer=setTimeout(()=>{curtains.classList.add('open');setTimeout(startCountdown,1500);},1300);}function cancelHold(){clearTimeout(holdTimer);sealBtn.innerHTML='<span>SEAL</span><small style="font-size:10px;margin-top:4px">HOLD 2 SEC<br>DONT LET GO!</small>';}
sealBtn.addEventListener('mousedown',startHold);sealBtn.addEventListener('touchstart',startHold,{passive:false});sealBtn.addEventListener('mouseup',cancelHold);sealBtn.addEventListener('touchend',cancelHold);
function startCountdown(){document.getElementById('seal-screen').classList.add('hidden');const cd=document.getElementById('countdown');cd.classList.remove('hidden');let nums=['3','2','1','0'];let idx=0;document.getElementById('countNum').innerText=nums[0];let intv=setInterval(()=>{idx++;if(idx<nums.length){document.getElementById('countNum').innerText=nums[idx];}else{clearInterval(intv);cd.classList.add('hidden');document.getElementById('party').classList.remove('hidden');}},800);}
function showCake(){document.getElementById('party').classList.add('hidden');document.getElementById('cake-screen').classList.remove('hidden');}
document.getElementById('cake').addEventListener('click',()=>{const cake=document.getElementById('cake');cake.innerText='🍰';document.getElementById('happyText').classList.remove('hidden');document.getElementById('nextToGallery').classList.remove('hidden');for(let i=0;i<160;i++){let c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background='hsl('+(320+Math.random()*40)+',100%,70%)';c.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000);}});
function showGallery(){document.getElementById('cake-screen').classList.add('hidden');document.getElementById('gallery').classList.remove('hidden');}
function showLetter(){document.getElementById('gallery').classList.add('hidden');document.getElementById('letter').classList.remove('hidden');}
const letterText="My favorite person 💖\n\nRimsha, you are 19 today!\nMy girl was born 19 years ago today and I'm the luckiest to have you.\n\nFrom the day you came into my life, everything became more beautiful.\n\nYou are my comfort, my happiness, my peace, and my favorite person. Every moment with you is my favorite memory.\n\nOn your 19th birthday, I promise to make every year even more special than the last.\n\nThank you for being you, for being mine.\n\nI love you forever and ever.\n\nAlways yours,\n- Your Saram ❤️";
document.getElementById('sealToOpen').addEventListener('click', function(){this.innerHTML='<span>...</span>';setTimeout(()=>{this.classList.add('hidden');const box=document.getElementById('messageBox');const btn=document.getElementById('finalBtn');box.classList.remove('hidden');btn.classList.remove('hidden');let i=0;let timer=setInterval(()=>{box.innerText+=letterText.charAt(i);i++;if(i>=letterText.length)clearInterval(timer);},28);},900);});
function finalConfetti(){for(let i=0;i<250;i++){let c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background='hsl('+Math.random()*360+',100%,70%)';c.style.animationDelay=Math.random()*2.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500);}setTimeout(()=>{alert('Happy 19th Birthday My Rimsha! 🎉💖');},800);}
</script></body></html>
